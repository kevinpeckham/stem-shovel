name: secrets

# Scans the whole history for leaked credentials on every push and pull
# request (docs/security.md). The repository is public: a token committed by
# mistake is public the moment it lands, so this is a tripwire, not a lock;
# rotate anything it finds.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
