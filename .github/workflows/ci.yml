name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No 1Password in CI: the varlock Vite plugin is skipped (vite.config.ts) and
# the tests mock the environment. Builds still run only on Vercel, with 1Password.
env:
  SKIP_VARLOCK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
