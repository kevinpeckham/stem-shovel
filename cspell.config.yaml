# Spell check for prose: the user docs, the privacy and copyright pages, the
# project docs, README, SECURITY and the changelog. `bun run spell`; CI runs it.
version: "0.2"
language: en,en-GB
files:
  - "/\\b[A-Za-z0-9_-]{21}\\b/g" # nanoids
  - "/`[^`]*`/g" # inline code
  - "/```[\\s\\S]*?```/g" # fenced code
  - "/https?:\\/\\/\\S+/g" # urls
  - "CHANGELOG.md"
  - "CLAUDE.md"
  - "docs/**/*.md"
  - "README.md"
  - "scripts/user-docs/*.md"
  - "SECURITY.md"
  - .svelte-kit
  - ALAC
  - Authy
  - Bahiana
  - demuxer
  - HSTS
  - Krumhansl
  - MMKK
  - node_modules
  - TOTP
  - Turso
  - unmuted
