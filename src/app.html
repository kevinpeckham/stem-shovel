<!doctype html>
<html lang="en" class="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/icons/stem-shovel-icon.svg" />
		<!-- barmark's chart font, registered once on the document (a browser ignores @font-face inside the chart's shadow root); the element sees this and leaves it alone. The literal is fontFaceCss("/fonts/barmark/Edwin-Roman.otf"), checked by src/lib/server/barmarkFont.test.ts. -->
		<!-- prettier-ignore -->
		<style data-barmark-font>@font-face{font-family:"barmark Edwin";src:url("/fonts/barmark/Edwin-Roman.otf") format("opentype");font-display:swap}</style>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="font-sans bg-dark bg-gradient-to-br from-blue-950/20 via-dark to-blue-950/40 text-on-dark bg-dark max-w-screen overflow-x-hidden"
	>
		<div
			class="grid grid-cols-1 grid-rows-[auto_1fr_auto] max-w-full overflow-x-hidden min-h-screen w-full"
		>
			%sveltekit.body%
		</div>
	</body>
</html>
